<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lá Vem História - Guarde suas histórias de família</title>
    <meta name="description" content="Responda perguntas guiadas sobre a sua vida e transforme suas respostas em um livro para as próximas gerações.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="landing-container">
        <!-- Left Section -->
        <section class="content-left">
            <div class="logo-container">
                <img src="logo.svg" alt="Lá Vem História" class="logo-img">
            </div>

            <div class="hero-text">
                <div class="text-group">
                    <h1 class="headline">
                        Histórias de família se perdem.<br>
                        Até que você decide guardá-las.
                    </h1>
                    <p class="subheadline">
                        Responda perguntas guiadas sobre a sua vida e transforme suas respostas em um livro para as próximas gerações.
                    </p>
                </div>
                
                <div class="button-container">
                    <button class="btn-secondary">Em breve</button>
                </div>
            </div>

            <div class="contact-footer">
                <p>oi@lavemhistoria.com.br</p>
            </div>
        </section>

        <!-- Right Section -->
        <section class="content-right">
            <div class="image-wrapper">
                <img class="main-image" src="http://localhost:3845/assets/07245e917c9f35de1eecb15effd16ac0c197f605.png" alt="Mãos segurando um livro de memórias">
                <img class="overlay-image" src="http://localhost:3845/assets/abf274556400a3b38a16dcabad9c50a0ac671e94.png" alt="" aria-hidden="true">
            </div>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
